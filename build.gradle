plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.13'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.krishichetan'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		sourceCompatibility = JavaVersion.VERSION_17
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
	maven { url 'https://repo.spring.io/snapshot' }
}

ext {
	set('springAiVersion', "1.1.3")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-web-services'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// 1. Google AI Studio (Free Tier Gemini) - Correct 1.1.3 name
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'

	// 2. PGVector Database - Correct 1.1.3 name
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'

	// 3. PDF Reader - Correct 1.1.3 name
	implementation 'org.springframework.ai:spring-ai-pdf-document-reader'
	// Database & Utils
	runtimeOnly 'com.h2database:h2' // For local testing/audit logs
	runtimeOnly 'org.postgresql:postgresql' // For the production Vector Store
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
